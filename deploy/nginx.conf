limit_req_zone $binary_remote_addr zone=arc_rpc:10m rate=15r/s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://gateway.pinata.cloud; connect-src 'self' https://api.circle.com https://rpc.mainnet.arc.io https://rpc.testnet.arc.io; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = /healthz { access_log off; return 200 'ok'; }
    location = /api/arc-rpc {
        include /etc/nginx/rpc-proxy.conf;
        proxy_pass https://rpc.testnet.arc.io/;
    }
    location = /api/arc-rpc-quicknode {
        include /etc/nginx/rpc-proxy.conf;
        proxy_pass https://rpc.quicknode.testnet.arc.io/;
    }
    location = /api/arc-rpc-drpc {
        include /etc/nginx/rpc-proxy.conf;
        proxy_pass https://rpc.drpc.testnet.arc.io/;
    }
    location = /api/arc-rpc-mainnet {
        include /etc/nginx/rpc-proxy.conf;
        proxy_pass https://rpc.mainnet.arc.io/;
    }
    location = /api/arc-rpc-mainnet-quicknode {
        include /etc/nginx/rpc-proxy.conf;
        proxy_pass https://rpc.quicknode.mainnet.arc.io/;
    }
    location = /api/arc-rpc-mainnet-drpc {
        include /etc/nginx/rpc-proxy.conf;
        proxy_pass https://rpc.drpc.mainnet.arc.io/;
    }
    location /api/media/ {
        client_max_body_size 3m;
        limit_req zone=arc_rpc burst=5 nodelay;
        proxy_pass http://127.0.0.1:5192;
        proxy_read_timeout 60s;
    }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location ~ /\. { deny all; }
}
