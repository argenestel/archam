[profile.default]
src = "contracts/src"
test = "contracts/test"
out = "contracts/out"
cache_path = "contracts/cache"
libs = ["node_modules", "contracts/lib"]
remappings = ["@openzeppelin/=node_modules/@openzeppelin/", "forge-std/=contracts/lib/forge-std/src/"]
solc_version = "0.8.30"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "node_modules" }]

[invariant]
runs = 64
depth = 120
fail_on_revert = false
